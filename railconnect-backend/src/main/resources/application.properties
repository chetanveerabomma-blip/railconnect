# =============================================================================
# RAILCONNECT — Spring Boot Central Configuration
# =============================================================================

server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=railconnect-backend

# -----------------------------------------------------------------------------
# Default Profile: Embedded In-Memory Database with MySQL Dialect Mode
# Allows immediate startup, compilation, and evaluation without external daemon.
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:railconnect_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -----------------------------------------------------------------------------
# RailConnect JWT & Security Settings
# -----------------------------------------------------------------------------
railconnect.jwt.secret=RailConnectSuperSecretKeyForAuthentication2026SecureKeyWith256BitsMinimum
railconnect.jwt.expiration-ms=86400000

# -----------------------------------------------------------------------------
# RailConnect Journey Weather Module Settings
# -----------------------------------------------------------------------------
railconnect.weather.api-key=
railconnect.weather.api-url=https://api.openweathermap.org/data/2.5/weather

# Jackson JSON Settings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true
