# =============================================================================
# RAILCONNECT — Production MySQL Configuration Profile
# Activate using: --spring.profiles.active=mysql
# =============================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/railconnect_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
